<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Peek Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #9ca3af;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card {
            background-color: #111827;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .label {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 8px;
        }
        .value {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            word-break: break-word;
        }
        .phone-value {
            font-size: 1.5rem;
            color: #34d399;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #10b981;
        }
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            color: #9ca3af;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Contact Peek</h1>
        
        <div class="card">
            <div class="label">Received Name</div>
            <div id="name-display" class="value">Waiting for input...</div>
        </div>

        <div class="card">
            <div class="label">Received Phone</div>
            <div id="phone-display" class="value phone-value">—</div>
        </div>

        <div class="status-container">
            <span class="status-indicator"></span>
            <span>Live Sync Active</span>
        </div>
    </div>

    <script>
        async function pollContact() {
            try {
                const response = await fetch('/api/contact');
                if (!response.ok) return;
                
                const data = await response.json();
                
                document.getElementById('name-display').innerText = data.name || "No Name Received";
                document.getElementById('phone-display').innerText = data.phone || "No Phone Received";
            } catch (err) {
                console.error("Polling sync error:", err);
            }
        }

        // Poll every 1 second for near-instant peek updates
        setInterval(pollContact, 1000);
        pollContact(); // Immediate initial fetch
    </script>
</body>
</html>
