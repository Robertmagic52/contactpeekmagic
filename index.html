<script>
    async function pollContact() {
        try {
            const response = await fetch('/api/contact');
            if (!response.ok) return;
            const data = await response.json();
            document.getElementById('name-display').innerText = data.name || "Waiting for input...";
            document.getElementById('phone-display').innerText = data.phone || "—";
        } catch (err) {
            console.error("Polling error:", err);
        }
    }

    async function setControlState(actionState) {
        try {
            const payload = { action: actionState };
            
            // Only reset the text if you press Stop
            if (actionState === 'stop') {
                payload.name = 'Waiting for input...';
                payload.phone = '—';
            }

            await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            pollContact();
        } catch (err) {
            console.error("Control error:", err);
        }
    }

    setInterval(pollContact, 1000);
    pollContact();
</script>
