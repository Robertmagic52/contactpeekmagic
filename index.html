<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Peek Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 { font-size: 1.5rem; color: #9ca3af; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .card { background-color: #111827; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #374151; }
        .label { font-size: 0.875rem; color: #6b7280; margin-bottom: 8px; }
        .value { font-size: 2rem; font-weight: 700; color: #ffffff; word-break: break-word; }
        .phone-value { font-size: 1.5rem; color: #34d399; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-start { background-color: #10b981; color: white; }
        .btn-stop { background-color: #ef4444; color: white; }
        .status-container { display: flex; align-items: center; justify-content: center; font-size: 0.875rem; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Peek</h1>
        
        <div class="controls">
            <button class="btn-start" onclick="setControlState('start')">Start</button>
            <button class="btn-stop" onclick="setControlState('stop')">Stop</button>
        </div>

        <div class="card">
            <div class="label">Received Name</div>
            <div id="name-display" class="value">Waiting for input...</div>
        </div>

        <div class="card">
            <div class="label">Received Phone</div>
            <div id="phone-display" class="value phone-value">—</div>
        </div>

        <div class="status-container">
            <span id="status-text">Status: Active Sync</span>
        </div>
    </div>

    <script>
        async function pollContact() {
            try {
                const response = await fetch('/api/contact');
                if (!response.ok) return;
                const data = await response.json();
                document.getElementById('name-display').innerText = data.name || "Waiting for input...";
                document.getElementById('phone-display').innerText = data.phone || "—";
            } catch (err) {
                console.error("Polling error:", err);
            }
        }

        async function setControlState(actionState) {
            try {
                await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionState, name: actionState === 'stop' ? 'Waiting for input...' : 'Manual Override' })
                });
                pollContact();
            } catch (err) {
                console.error("Control error:", err);
            }
        }

        setInterval(pollContact, 1000);
        pollContact();
    </script>
</body>
</html>
